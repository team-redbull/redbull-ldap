{{- if not .Values.secret.existingSecret }}
{{/*
Only rendered when you are not bringing your own Secret. Pass the value with
--set secret.adApiClientId=... or a private values file; do not commit it.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "redbull-ldap.fullname" . }}
  labels:
    {{- include "redbull-ldap.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secret.key }}: {{ required "Set secret.adApiClientId, or point secret.existingSecret at a Secret you manage" .Values.secret.adApiClientId | quote }}
{{- end }}
